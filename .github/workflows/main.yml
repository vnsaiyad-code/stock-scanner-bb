name: Stock Scanner + Paper Trading

on:
  workflow_dispatch:

  schedule:
    - cron: "0 22 * * 1-5"
      timezone: "Asia/Kolkata"

jobs:
  scan-and-paper-trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install yfinance pandas numpy gspread google-auth

      - name: Run Stock Scanner
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python scanner.py

      - name: Run Paper Trading Engine
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python paper_trading_engine.py
